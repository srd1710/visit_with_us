name: Tourism Project Pipeline

on:
  push:
    branches: [main]
    paths-ignore:
      - "visit_with_us_mlops/tourism_project/deployment/model.joblib"
      - "visit_with_us_mlops/tourism_project/deployment/model_metadata.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tourism-ml-pipeline
  cancel-in-progress: false

jobs:
  register-dataset:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: visit_with_us_mlops/tourism_project/requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas

      - name: Validate dataset
        working-directory: visit_with_us_mlops/tourism_project
        run: python model_building/data_register.py

      - name: Verify dataset
        working-directory: visit_with_us_mlops/tourism_project
        run: |
          pwd
          ls -lh data/tourism.csv

      - name: Upload registered dataset
        uses: actions/upload-artifact@v4
        with:
          name: registered-data
          path: visit_with_us_mlops/tourism_project/data/tourism.csv
          if-no-files-found: error

  data-prep:
    needs: register-dataset
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: visit_with_us_mlops/tourism_project/requirements.txt

      - name: Install preparation dependencies
        run: python -m pip install pandas scikit-learn

      - name: Run data preparation
        working-directory: visit_with_us_mlops/tourism_project
        run: python model_building/prep.py

      - name: Verify generated splits
        working-directory: visit_with_us_mlops/tourism_project
        run: |
          echo "Checking generated train/test files..."
          ls -lah artifacts/splits/
          echo "CSV files:"
          find artifacts/splits -type f -name "*.csv"

      - name: Upload train/test splits
        uses: actions/upload-artifact@v4
        with:
          name: data-splits
          path: visit_with_us_mlops/tourism_project/artifacts/splits/*.csv
          if-no-files-found: error

  model-training:
    needs: data-prep
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: visit_with_us_mlops/tourism_project/requirements.txt

      - name: Install training dependencies
        working-directory: visit_with_us_mlops/tourism_project
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn xgboost mlflow joblib

      - name: Download train/test splits
        uses: actions/download-artifact@v4
        with:
          name: data-splits
          path: visit_with_us_mlops/tourism_project/artifacts/splits

      - name: Verify downloaded splits
        working-directory: visit_with_us_mlops/tourism_project
        run: ls -lah artifacts/splits/

      - name: Train, tune, evaluate and register model
        working-directory: visit_with_us_mlops/tourism_project
        run: python model_building/train.py

      - name: Upload MLflow tracking data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-run-data
          path: |
            visit_with_us_mlops/tourism_project/mlflow.db
            visit_with_us_mlops/tourism_project/mlruns/
            visit_with_us_mlops/tourism_project/mlartifacts/
          if-no-files-found: ignore

      - name: Commit trained model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add visit_with_us_mlops/tourism_project/deployment/model.joblib \
                  visit_with_us_mlops/tourism_project/deployment/model_metadata.json

          if git diff --cached --quiet; then
            echo "No model changes to commit."
          else
            git commit -m "Update trained tourism purchase model [skip ci]"
            git push
          fi
