name: Tourism Project Pipeline

on:
  push:
    branches: [main]
    paths-ignore:
      - "visit_with_us_mlops/tourism_project/deployment/model.joblib"
      - "visit_with_us_mlops/tourism_project/deployment/model_metadata.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tourism-ml-pipeline
  cancel-in-progress: false

jobs:
  register-dataset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: visit_with_us_mlops/tourism_project/requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas

      - name: Validate dataset
        run: python visit_with_us_mlops/tourism_project/model_building/data_register.py

      - name: Debug generated files
        run: |
          echo "Current directory:"
          pwd
          echo "Searching for generated CSV files:"
          find . -type f -name "*.csv"
          echo "Checking artifacts directories:"
          find . -type d -name "artifacts"

      - name: Upload registered dataset
        uses: actions/upload-artifact@v4
        with:
          name: registered-data
          path: visit_with_us_mlops/tourism_project/data/tourism.csv
          if-no-files-found: error

  data-prep:
    needs: register-dataset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: visit_with_us_mlops/tourism_project/requirements.txt

      - name: Install preparation dependencies
        run: python -m pip install pandas scikit-learn

      - name: Run data preparation
        run: python visit_with_us_mlops/tourism_project/model_building/prep.py

      - name: Upload train/test splits
        uses: actions/upload-artifact@v4
        with:
          name: data-splits
          path: artifacts/splits/*.csv
          if-no-files-found: error

  model-training:
    needs: data-prep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: visit_with_us_mlops/tourism_project/requirements.txt

      - name: Install training dependencies
        run: python -m pip install --upgrade pip -r visit_with_us_mlops/tourism_project/requirements.txt

      - name: Download train/test splits
        uses: actions/download-artifact@v4
        with:
          name: data-splits
          path: artifacts/splits

      - name: Train, tune, evaluate and register model
        env:
          MLFLOW_TRACKING_URI: file:./mlruns
        run: python visit_with_us_mlops/tourism_project/model_building/train.py

      - name: Upload MLflow tracking data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-run-data
          path: mlruns/
          if-no-files-found: ignore

      - name: Commit trained model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add visit_with_us_mlops/tourism_project/deployment/model.joblib \
                  visit_with_us_mlops/tourism_project/deployment/model_metadata.json
          if git diff --cached --quiet; then
            echo "No model changes to commit."
          else
            git commit -m "Update trained tourism purchase model [skip ci]"
            git push
          fi
